schema_version: "1.1"
name: gate-stop-step0
plugins: ["../_condition"]
context:
  # The declared path MUST live inside this case directory: a path escaping it is a
  # setup failure that scores the run 0 with no graders at all. So each case carries a
  # one-line delegating scaffold; only the declared path is validated, not what the
  # script then does.
  #
  # The fixture reaches the sandbox ONLY through this declaration, and the runner must
  # also pass --scaffold. Without both, the workspace is empty and the prompt describes
  # a service that is not there.
  scaffold_script: scaffold.sh
# Nothing else belongs here. Prompt, tools, runs and tags live in prompt.md's
# frontmatter, which overrides this file; `context.*` cannot be set from prompt.md, and
# that is the only reason this file exists. Checked against prompt.md: no key above is
# one prompt.md also sets, so nothing here can be silently overridden.
