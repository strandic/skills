schema_version: "1.1"
name: step3-markers-in-source
tags: [capability]
plugins: ["../_condition"]
context:
  # TODO: author history.jsonl. Verified in recon: a HAND-WRITTEN transcript
  # resumes correctly — no need to record and trim a real session. Two records
  # suffice, each carrying type (user|assistant), uuid, parentUuid (null first),
  # message {role, content}, sessionId, cwd, version, userType, isSidechain,
  # timestamp. Assistant content is a block list, user content a plain string.
  #
  # TODO: keep it method-neutral — the step 0-2 artifacts, no gate prose, no step
  # numbering, so a no-plugin run cannot inherit the method by imitation.
  history_file: history.jsonl
execution:
  prompt: "proceed"
  max_turns: 14
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
runs: 5
graders: []   # TODO: graders live in graders/*.md alongside this file
