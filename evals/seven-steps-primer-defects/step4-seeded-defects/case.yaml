schema_version: "1.1"
name: step4-seeded-defects
tags: [outcome, scored]
plugins: ["../../_conditions/current"]
# Declared, not derived: the one replay case that runs both arms. The runner's
# derivation would make a history_file case capability/none (its transcript carries the
# plugin into both arms); here the seed turn names no skill and the without-arm is a
# registered column, so the case says so itself (ReadDeclaredEvidence).
evidence: delta
ablation: with-without
context:
    # history.jsonl: records 0 to 5 from evals/seven-steps-primer/step3-markers-in-source
  # rewritten as a superset of both methods' steps 1 to 3 (names + shapes, inventory +
  # signatures, walkthrough + markers), record 0 opening with Amendment 2's neutral line,
  # records 6 and 7 adding the cleared gate 2 and the markers placed, closing on Gate 3.
  # No skill named. Record 7 names the marker token TODO(per-user), which no grader on
  # this case greps for. Written at step 4; resumed correctly in nine recon runs.
  history_file: history.jsonl
  scaffold_script: scaffold.sh
execution:
  # Verbatim from 0-plan.md D1. The middle sentence is Amendment 2's line; the last is
  # neutral between running and reading and exists because the judge reads the reply.
  prompt: "Gate 3 cleared. Proceed. If a documented method for this kind of change is available to you, follow it. Put what you find in your reply, not only in a file."
    # Set from the recon runs (4-recon.md): the treatment's with-arm took 26 to 31 turns and
  # 154 to 298 s; twice the worst is the cap, so a cap decides no score.
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
# Matches the registration's runsPerCase.
runs: 10
# graders/ holds reported-<id>.md (llm, focus last_message, the ledger's criteria.md, one
# per accepted defect), surfaced-<id>.md (regex over the trace, one per run-only defect —
# none at present: recon classified every defect read-visible), and the three guards.
# Regenerated from the ledger by the step-6 generator whenever a class changes.
graders: []
